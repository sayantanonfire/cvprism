[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cvprism"
version = "1.2.0"
description = "Turn everyday work across many computers into evidence-backed, role-specific CVs."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "cvprism contributors" }]
dependencies = [
  "typer>=0.12",
  "ruamel.yaml>=0.18",
  "jsonschema>=4.20",
  "platformdirs>=4.0",
  "watchdog>=4.0",
  "segno>=1.6",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Office/Business",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]
pdf = ["rendercv[full]>=2.8,<3; python_version >= '3.12'", "pypdf>=4"]
docx = ["python-docx>=1.1"]
all = ["rendercv[full]>=2.8,<3; python_version >= '3.12'", "python-docx>=1.1", "pypdf>=4"]

[project.scripts]
cvprism = "cvprism.cli:app"
cvprism-hook = "cvprism.capture.hookentry:main"

[project.urls]
Homepage = "https://github.com/sayantanonfire/cvprism"

[tool.setuptools.packages.find]
include = ["cvprism*"]
exclude = ["*__pycache__*"]

[tool.setuptools.package-data]
"cvprism.schemas" = ["*.json"]
"cvprism.data" = ["**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
