<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-labelledby="t d">
  <title id="t">How cvprism works</title>
  <desc id="d">Four steps: you work as usual; cvprism notes the skill, not your files; your computers share the notes; you get a CV for any job, with proof for every line.</desc>
  <rect width="1280" height="330" fill="#EEF1F5"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- connectors -->
    <g stroke="#9AA3B2" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round">
      <path d="M300 120 H335"/><path d="M620 120 H655"/><path d="M940 120 H975"/>
    </g>

    <!-- step 1 -->
    <g transform="translate(40,30)">
      <rect width="260" height="270" rx="10" fill="#FFFFFF" stroke="#CDD3DC"/>
      <circle cx="40" cy="40" r="18" fill="#3346C8"/><text x="40" y="47" text-anchor="middle" font-size="18" font-weight="700" fill="#FFF">1</text>
      <rect x="70" y="72" width="120" height="76" rx="6" fill="#E4E9F1" stroke="#1A2230" stroke-width="2"/>
      <path d="M84 92h60M84 106h80M84 120h44" stroke="#3346C8" stroke-width="5" stroke-linecap="round"/>
      <text x="24" y="190" font-size="20" font-weight="650" fill="#1A2230">You work as usual</text>
      <text x="24" y="216" font-size="15" fill="#5A6577">Code with Claude Code, commit,</text>
      <text x="24" y="236" font-size="15" fill="#5A6577">add a library, write a paper,</text>
      <text x="24" y="256" font-size="15" fill="#5A6577">do field work.</text>
    </g>

    <!-- step 2 -->
    <g transform="translate(360,30)">
      <rect width="260" height="270" rx="10" fill="#FFFFFF" stroke="#CDD3DC"/>
      <circle cx="40" cy="40" r="18" fill="#2A9D8F"/><text x="40" y="47" text-anchor="middle" font-size="18" font-weight="700" fill="#FFF">2</text>
      <rect x="62" y="70" width="136" height="82" rx="8" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="2.5"/>
      <text x="76" y="96" font-size="14" font-weight="650" fill="#1A2230">Built an MCP server</text>
      <text x="76" y="116" font-size="13" fill="#5A6577">skill: MCP servers</text>
      <text x="76" y="136" font-size="13" fill="#5A6577">level: built</text>
      <text x="24" y="190" font-size="20" font-weight="650" fill="#1A2230">It notes the skill</text>
      <text x="24" y="216" font-size="15" fill="#5A6577">A small "evidence card": what</text>
      <text x="24" y="236" font-size="15" fill="#5A6577">you did and how well. Never your</text>
      <text x="24" y="256" font-size="15" fill="#5A6577">code, files or data.</text>
    </g>

    <!-- step 3 -->
    <g transform="translate(680,30)">
      <rect width="260" height="270" rx="10" fill="#FFFFFF" stroke="#CDD3DC"/>
      <circle cx="40" cy="40" r="18" fill="#C9A43E"/><text x="40" y="47" text-anchor="middle" font-size="18" font-weight="700" fill="#FFF">3</text>
      <rect x="56" y="78" width="52" height="34" rx="4" fill="#E4E9F1" stroke="#1A2230" stroke-width="2"/>
      <rect x="56" y="124" width="52" height="34" rx="4" fill="#E4E9F1" stroke="#1A2230" stroke-width="2"/>
      <rect x="160" y="92" width="64" height="48" rx="5" fill="#FFFFFF" stroke="#1A2230" stroke-width="2.5"/>
      <text x="192" y="122" text-anchor="middle" font-size="13" font-weight="650" fill="#1A2230">hub</text>
      <path d="M112 95 L156 110 M112 141 L156 124" stroke="#C9A43E" stroke-width="3.5" stroke-linecap="round"/>
      <text x="24" y="190" font-size="20" font-weight="650" fill="#1A2230">Computers share</text>
      <text x="24" y="216" font-size="15" fill="#5A6577">Cards travel to your main</text>
      <text x="24" y="236" font-size="15" fill="#5A6577">computer by GitHub, Google Drive,</text>
      <text x="24" y="256" font-size="15" fill="#5A6577">a USB stick or your Wi-Fi.</text>
    </g>

    <!-- step 4 -->
    <g transform="translate(1000,30)">
      <rect width="240" height="270" rx="10" fill="#FFFFFF" stroke="#CDD3DC"/>
      <circle cx="40" cy="40" r="18" fill="#E5533D"/><text x="40" y="47" text-anchor="middle" font-size="18" font-weight="700" fill="#FFF">4</text>
      <rect x="74" y="64" width="86" height="104" rx="4" fill="#FFFFFF" stroke="#1A2230" stroke-width="2"/>
      <path d="M88 84h44M88 100h58M88 114h50M88 128h58M88 142h36" stroke="#9AA3B2" stroke-width="4" stroke-linecap="round"/>
      <circle cx="158" cy="160" r="15" fill="#2A9D8F"/><path d="M151 160l5 5 9-10" stroke="#FFF" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text x="24" y="190" font-size="20" font-weight="650" fill="#1A2230">You get a CV</text>
      <text x="24" y="216" font-size="15" fill="#5A6577">For any role or job ad, as</text>
      <text x="24" y="236" font-size="15" fill="#5A6577">PDF or Word. Every line has</text>
      <text x="24" y="256" font-size="15" fill="#5A6577">proof behind it.</text>
    </g>
  </g>
</svg>
