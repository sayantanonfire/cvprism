name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write   # gh-deploy pushes the built site to the gh-pages branch

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e . mkdocs-material
      - name: CLI reference is up to date
        run: |
          typer cvprism.cli utils docs --name cvprism --title "CLI reference" --output docs/guide/cli.md
          git diff --exit-code docs/guide/cli.md
      - name: Build (strict)
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: |
          cp CONTRIBUTING.md docs/contributing.md
          mkdocs build --strict
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force
