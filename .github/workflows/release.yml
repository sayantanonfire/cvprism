name: release

# Push a tag like v1.0.0 to build, publish to PyPI (trusted publishing) and create a GitHub release.
# PyPI publishing is opt-in. One-time setup:
#   1. pypi.org -> Publishing -> add a pending publisher: project `cvprism`, owner `sayantanonfire`,
#      repo `cvprism`, workflow `release.yml`, environment `pypi`.
#   2. GitHub repo -> Settings -> Variables -> Actions: PYPI_PUBLISH = true

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version $v"; exit 1; }
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

  pypi:
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "cvprism $GITHUB_REF_NAME" --notes-file CHANGELOG.md

  windows-bundle:
    needs: github-release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build bundle
        shell: pwsh
        run: ./tools/build_windows_bundle.ps1
      - name: Smoke test bundle
        shell: pwsh
        run: ./tools/smoke_windows_bundle.ps1
      - name: Attach to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" dist/cvprism-windows.zip --clobber
