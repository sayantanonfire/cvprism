name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please never paste real career data, cards or transcripts. Use synthetic examples."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `cvprism doctor`
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "cvprism --version"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
