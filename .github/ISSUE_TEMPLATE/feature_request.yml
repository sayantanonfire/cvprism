name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: checkboxes
    id: principles
    attributes:
      label: Fits the project principles
      options:
        - label: It does not require capturing code, file contents or data
        - label: It does not let a CV claim more than the evidence supports
